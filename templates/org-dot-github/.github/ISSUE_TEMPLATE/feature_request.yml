name: Đề xuất tính năng
description: Nhu cầu mới hoặc cải tiến
title: "feat: <mô tả ngắn>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề cần giải quyết
      description: Ai gặp vấn đề, trong tình huống nào?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Đề xuất
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Tiêu chí nghiệm thu
      placeholder: "- Khi ... thì ...\n- Người không có quyền ... nhận 403"
    validations:
      required: true
